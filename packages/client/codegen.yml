schema: 'http://localhost:3000/graphql' # URL do seu backend NestJS
documents: 
  - 'src/**/*.graphql'
  - 'src/**/*.ts'
generates:
  # Gerar tipos TypeScript
  src/app/generated/graphql.types.ts:
    plugins:
      - typescript
      - typescript-operations
    config:
      scalars:
        DateTime: string
        Upload: File
      namingConvention:
        typeNames: change-case-all#pascalCase
        enumValues: change-case-all#upperCase
      
  # Gerar serviços Angular Apollo
  src/app/generated/graphql.services.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-apollo-angular
    config:
      serviceName: 'GQL'
      # serviceProvidedIn: root
      scalars:
        DateTime: string
        Upload: File
      namingConvention:
        typeNames: change-case-all#pascalCase
        enumValues: change-case-all#upperCase
      avoidOptionals: true
      skipTypename: false
      withHooks: false
      withHOC: false
      withComponent: false
        
  # Gerar schema introspection (para desenvolvimento)
  src/app/generated/introspection.json:
    plugins:
      - introspection
      
  # Gerar SDL do schema
  src/app/generated/schema.graphql:
    plugins:
      - schema-ast

# Configurações adicionais
config:
  # Não gerar comentários desnecessários
  addUnderscoreToArgsType: true
  # Gerar apenas o que for usado
  onlyOperationTypes: false
  # Transformar nomes
  transformUnderscore: true

hooks:
  afterAllFileWrite:
    - prettier --write
