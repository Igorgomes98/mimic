type Mutation {
  createCompany(createCompanyInput: CreateCompanyInput!): Company!
  createProduct(createProductInput: CreateProductInput!): Product!
  createPurchase(createPurchaseInput: CreatePurchaseInput!): Purchase!
  createRole(createRoleInput: CreateRoleInput!): Role!
  createSale(createSaleInput: CreateSaleInput!): Sale!
  createSupplier(createSupplierInput: CreateSupplierInput!): Supplier!
  createUser(createUserInput: CreateUserInput!): User!
  deleteProduct(id: ID!): Product
  login(loginInput: LoginInput!): AuthResponse!
  removeCompany(id: String!): Company!
  removePurchase(id: Int!): Purchase!
  removeRole(id: String!): Role!
  removeSale(id: Int!): Sale!
  removeSupplier(id: Int!): Supplier!
  removeUser(id: String!): User!
  updateCompany(updateCompanyInput: UpdateCompanyInput!): Company!
  updateProduct(id: ID!, updateProductInput: UpdateProductInput!): Product!
  updatePurchase(updatePurchaseInput: UpdatePurchaseInput!): Purchase!
  updateRole(updateRoleInput: UpdateRoleInput!): Role!
  updateSale(updateSaleInput: UpdateSaleInput!): Sale!
  updateSupplier(updateSupplierInput: UpdateSupplierInput!): Supplier!
  updateUser(updateUserInput: UpdateUserInput!): User!
}

