<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">
        <span class="logo-text-icon" *ngIf="!isCollapsed">MIMIC</span>
        <span class="logo-text-icon-small" *ngIf="isCollapsed">M</span>
      </div>
    </div>
  </div>
  
  <div class="user-section" *ngIf="!isCollapsed">
    <p class="user-label">Nome Principal</p>
  </div>
  
  <div class="sidebar-content">
    <nav class="sidebar-menu">
      <ul>
        <li>
          <a routerLink="/app/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <i class="fas fa-chart-line"></i>
            <span *ngIf="!isCollapsed">Dashboard</span>
            <span class="tooltip" *ngIf="isCollapsed">Dashboard</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/vendas" routerLinkActive="active">
            <i class="fas fa-shopping-cart"></i>
            <span *ngIf="!isCollapsed">Vendas</span>
            <span class="tooltip" *ngIf="isCollapsed">Vendas</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/compras" routerLinkActive="active">
            <i class="fas fa-shopping-bag"></i>
            <span *ngIf="!isCollapsed">Compras</span>
            <span class="tooltip" *ngIf="isCollapsed">Compras</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/produtos" routerLinkActive="active">
            <i class="fas fa-box"></i>
            <span *ngIf="!isCollapsed">Produtos</span>
            <span class="tooltip" *ngIf="isCollapsed">Produtos</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/estoque" routerLinkActive="active">
            <i class="fas fa-warehouse"></i>
            <span *ngIf="!isCollapsed">Estoque</span>
            <span class="tooltip" *ngIf="isCollapsed">Estoque</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/clientes" routerLinkActive="active">
            <i class="fas fa-users"></i>
            <span *ngIf="!isCollapsed">Clientes</span>
            <span class="tooltip" *ngIf="isCollapsed">Clientes</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/fornecedores" routerLinkActive="active">
            <i class="fas fa-truck"></i>
            <span *ngIf="!isCollapsed">Fornecedores</span>
            <span class="tooltip" *ngIf="isCollapsed">Fornecedores</span>
          </a>
        </li>
        <li>
          <a routerLink="/app/configuracoes" routerLinkActive="active">
            <i class="fas fa-cog"></i>
            <span *ngIf="!isCollapsed">Configurações</span>
            <span class="tooltip" *ngIf="isCollapsed">Configurações</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
