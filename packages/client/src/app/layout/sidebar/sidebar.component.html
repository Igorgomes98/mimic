<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="fas fa-chart-pie"></i>
      </div>
      <h2 class="logo-text" *ngIf="!isCollapsed">Mimic CRM</h2>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()">
      <i class="fas" [class.fa-angle-left]="!isCollapsed" [class.fa-angle-right]="isCollapsed"></i>
    </button>
  </div>
  
  <div class="sidebar-content">
    <nav class="sidebar-menu">
      <ul>
        <li>
          <a routerLink="/dashboard" routerLinkActive="active">
            <i class="fas fa-tachometer-alt"></i>
            <span *ngIf="!isCollapsed">Dashboard</span>
            <span class="tooltip" *ngIf="isCollapsed">Dashboard</span>
          </a>
        </li>
        <li>
          <a routerLink="/clientes" routerLinkActive="active">
            <i class="fas fa-users"></i>
            <span *ngIf="!isCollapsed">Clientes</span>
            <span class="tooltip" *ngIf="isCollapsed">Clientes</span>
          </a>
        </li>
        <li>
          <a routerLink="/vendas" routerLinkActive="active">
            <i class="fas fa-shopping-cart"></i>
            <span *ngIf="!isCollapsed">Vendas</span>
            <span class="tooltip" *ngIf="isCollapsed">Vendas</span>
          </a>
        </li>
        <li>
          <a routerLink="/produtos" routerLinkActive="active">
            <i class="fas fa-box"></i>
            <span *ngIf="!isCollapsed">Produtos</span>
            <span class="tooltip" *ngIf="isCollapsed">Produtos</span>
          </a>
        </li>
        <li>
          <a routerLink="/financeiro" routerLinkActive="active">
            <i class="fas fa-dollar-sign"></i>
            <span *ngIf="!isCollapsed">Financeiro</span>
            <span class="tooltip" *ngIf="isCollapsed">Financeiro</span>
          </a>
        </li>
        <li>
          <a routerLink="/relatorios" routerLinkActive="active">
            <i class="fas fa-chart-bar"></i>
            <span *ngIf="!isCollapsed">Relatórios</span>
            <span class="tooltip" *ngIf="isCollapsed">Relatórios</span>
          </a>
        </li>
        <li>
          <a routerLink="/configuracoes" routerLinkActive="active">
            <i class="fas fa-cog"></i>
            <span *ngIf="!isCollapsed">Configurações</span>
            <span class="tooltip" *ngIf="isCollapsed">Configurações</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
  
  <div class="sidebar-footer">
    <a (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span *ngIf="!isCollapsed">Sair</span>
      <span class="tooltip" *ngIf="isCollapsed">Sair</span>
    </a>
  </div>
</aside>
