<div class="main-layout" 
     [class.sidebar-collapsed]="isSidebarCollapsed"
     [class.mobile-sidebar-open]="isMobileSidebarOpen">
  
  <app-sidebar></app-sidebar>
  
  <div class="sidebar-backdrop" *ngIf="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <div class="main-content">
    <!-- Header -->
    <header class="top-header">
      <div class="header-left">
        <button class="btn-toggle-mobile" (click)="toggleMobileSidebar()">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h2 class="page-title">Sistema Mimic</h2>
      </div>
      <div class="header-right">
        <div class="user-info" *ngIf="currentUser">
          <div class="user-details">
            <span class="user-name">{{ currentUser.name }}</span>
            <span class="user-company" *ngIf="currentUser.company">{{ currentUser.company.name }}</span>
          </div>
          <button class="btn-logout" (click)="logout()" title="Sair">
            <span class="material-symbols-outlined">logout</span>
          </button>
        </div>
      </div>
    </header>
    
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
